<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
<title id="title">BillZen — Money moves. You stay in control.</title>
<desc id="desc">An original brand illustration for the offline company cashbook: receipts, payments, inventory and reports, with local data at its core. Illustration, not an application screenshot.</desc>
