<text x="56" y="408" fill="#a6b3a2" font-family="Arial,sans-serif" font-size="21">Receipts. Payments. Stock. Clarity.</text>
<text x="56" y="444" fill="#80917b" font-family="Arial,sans-serif" font-size="17">Built for small businesses in India and the GCC.</text>
