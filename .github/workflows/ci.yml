name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-rust:
    name: Rust Tests & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for Tauri & WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run Cargo Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Setup Node for transfer backup interoperability
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify native and browser transfer backup interoperability
        run: |
          npm ci
          npx playwright install --with-deps chrome
          npm run test:transfer-interop

      - name: Run Native Catalog Probe (Cross-Process Persistence & Invariants)
        run: |
          cargo run --bin catalog_probe --manifest-path src-tauri/Cargo.toml -- /tmp/ci_catalog_probe.db write
          cargo run --bin catalog_probe --manifest-path src-tauri/Cargo.toml -- /tmp/ci_catalog_probe.db read_and_verify

  test-frontend:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Validate release metadata and publisher contract
        run: |
          node scripts/release/version.mjs
          node --test scripts/release/tests/*.node.mjs

      - name: Run Production TypeScript & Vite Build
        run: npm run build

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium chrome

      - name: Verify durable workspace and customer cashbook integration
        run: |
          npm run test:workspace
          npm run test:drafts
          npm run test:transfers
          npm run test:transfers-ui
          npm run test:customer-cashbook

      - name: Run Playwright Catalog Verification
        run: npm run test:catalog

      - name: Run Playwright Responsive Verification
        run: npm run test:responsive

      - name: Verify Settings language preference and clean header
        run: node scripts/verify_header_tab_navigation.js

      - name: Verify interruptible motion and live reduced-motion preferences
        run: npm run test:motion
      - name: Stock adjustment engine and product workflow
        run: npm run test:stock && npm run test:stock-ui

      - name: Reports responsive filters and segmented motion
        run: npm run test:reports-refresh

      - name: Audit navigation and screen layouts across languages and themes
        run: node scripts/verify_layout_regression.js

      - name: Run Playwright Onboarding & Appearance Verification
        run: npm run test:onboarding

      - name: Run Playwright Invoice Matrix Verification
        run: npm run test:matrix

      - name: Run update screen, cashbook, theme and PDF regressions
        run: |
          npm run test:desktop-update-ui
          node scripts/verify_updates_browser.js
          npm run test:cashbook
          BILLZEN_TEST_CATEGORY_DELAY=1 npm run test:reports-ui
          npm run test:cashbook-ui
          node scripts/verify_theme_contrast.js
          npm run test:cashbook-pdf

      - name: Upload browser verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: test_artifacts/
          if-no-files-found: ignore
          retention-days: 14
