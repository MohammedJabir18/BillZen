name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-rust:
    name: Rust Tests & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for Tauri & WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run Cargo Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Native Catalog Probe (Cross-Process Persistence & Invariants)
        run: |
          cargo run --bin catalog_probe --manifest-path src-tauri/Cargo.toml -- /tmp/ci_catalog_probe.db write
          cargo run --bin catalog_probe --manifest-path src-tauri/Cargo.toml -- /tmp/ci_catalog_probe.db read_and_verify

  test-frontend:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Run Production TypeScript & Vite Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Catalog Verification
        run: npm run test:catalog

      - name: Run Playwright Invoice Matrix Verification
        run: npm run test:matrix
