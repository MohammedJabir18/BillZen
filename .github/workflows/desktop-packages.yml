name: Desktop Release Packages

on:
  workflow_dispatch:
    inputs:
      mac_only:
        description: Build only the Apple Silicon installer
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.mac_only && '[{"platform":"macOS-AppleSilicon","os":"macos-15","target":"aarch64-apple-darwin","bundles":"app,dmg"}]' || '[{"platform":"macOS-AppleSilicon","os":"macos-15","target":"aarch64-apple-darwin","bundles":"app,dmg"},{"platform":"Windows-x64","os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis"},{"platform":"Linux-x64","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","bundles":"deb,appimage"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - run: npm ci
      - name: Verify release and frontend
        run: |
          node scripts/release/version.mjs
          node --test scripts/release/tests/*.node.mjs
          npm test
      - name: Verify native domain
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Require desktop updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node -e "if (!process.env.TAURI_SIGNING_PRIVATE_KEY?.trim() || !process.env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD) throw new Error('Desktop updater signing secrets must be configured')"
      - name: Build installable packages
        env:
          # Ad-hoc signature preserves bundle integrity; it is not Apple Developer ID or notarization.
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: 'true'
          NO_STRIP: 'true'
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify Windows icon resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe)
          if ($setup.Count -ne 1) { throw 'Expected one installer' }
          python scripts/verify_windows_icons.py src-tauri/target/${{ matrix.target }}/release/billzen.exe $setup[0].FullName --output src-tauri/target/${{ matrix.target }}/release/bundle/nsis/icon-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Icon resource verification failed' }
      - name: Verify macOS bundle architecture and signature
        if: runner.os == 'macOS'
        run: |
          # Inspect the app actually delivered inside the read-only disk image.
          DMG_DIR=src-tauri/target/${{ matrix.target }}/release/bundle/dmg
          DMGS=("$DMG_DIR"/*.dmg)
          test "${#DMGS[@]}" -eq 1
          MOUNT=$(mktemp -d)
          trap 'hdiutil detach "$MOUNT" >/dev/null; rmdir "$MOUNT"' EXIT
          hdiutil attach "${DMGS[0]}" -readonly -nobrowse -mountpoint "$MOUNT"
          APP="$MOUNT/BillZen.app"
          lipo "$APP/Contents/MacOS/billzen" -verify_arch arm64
          codesign --verify --deep --strict --verbose=2 "$APP"
          ACTUAL=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")
          EXPECTED=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          test "$ACTUAL" = "$EXPECTED"
      - name: Collect exact installers and provenance
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/release/collect-desktop.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: BillZen-${{ matrix.platform }}
          path: dist-desktop/packages/*
          if-no-files-found: error
          retention-days: 30

  update-feed:
    name: Verify complete desktop updater feed
    if: ${{ !inputs.mac_only }}
    needs: package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: BillZen-*
          path: dist-desktop/packages
          merge-multiple: true
      - name: Merge and validate signed updater artifacts
        run: node scripts/release/build-desktop-feed.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: BillZen-desktop-update-feed
          path: dist-desktop/packages/desktop-update.json
          if-no-files-found: error
          retention-days: 30
