name: Desktop Release Packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-AppleSilicon
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: Windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: Linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - run: npm ci
      - name: Verify release and frontend
        run: |
          node scripts/release/version.mjs
          node --test scripts/release/tests/*.node.mjs
          npm test
      - name: Verify native domain
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build installable packages
        env:
          # Ad-hoc signature preserves bundle integrity; it is not Apple Developer ID or notarization.
          APPLE_SIGNING_IDENTITY: '-'
          CI: 'true'
          NO_STRIP: 'true'
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify Windows icon resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe)
          if ($setup.Count -ne 1) { throw 'Expected one installer' }
          python scripts/verify_windows_icons.py src-tauri/target/${{ matrix.target }}/release/billzen.exe $setup[0].FullName --output src-tauri/target/${{ matrix.target }}/release/bundle/nsis/icon-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Icon resource verification failed' }
      - name: Verify macOS bundle architecture and signature
        if: runner.os == 'macOS'
        run: |
          APP=src-tauri/target/${{ matrix.target }}/release/bundle/macos/BillZen.app
          lipo -verify_arch arm64 "$APP/Contents/MacOS/billzen"
          codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist"
      - name: Collect exact installers and provenance
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/release/collect-desktop.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: BillZen-${{ matrix.platform }}
          path: dist-desktop/packages/*
          if-no-files-found: error
          retention-days: 30
