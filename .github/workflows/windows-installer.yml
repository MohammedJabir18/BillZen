name: Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify frontend
        run: npm test
      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis
      - name: Verify app and setup icon resources
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installer.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          $setupPath = $installer[0].FullName
          python scripts/verify_windows_icons.py src-tauri/target/release/billzen.exe $setupPath --output src-tauri/target/release/bundle/nsis/icon-verification.json
          if ($LASTEXITCODE -ne 0) { throw "BillZen executable icon verification failed" }
      - name: Record installer provenance
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          $installer = $installers[0]
          $digest = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($installer.Name)" | Set-Content -Encoding ascii src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          @{
            commit = '${{ github.sha }}'
            runId = '${{ github.run_id }}'
            version = (Get-Content package.json | ConvertFrom-Json).version
            architecture = 'x64'
            file = $installer.Name
            sha256 = $digest
            sizeBytes = $installer.Length
            iconVerified = $true
            codeSigned = $false
            runtimeTested = $false
          } | ConvertTo-Json | Set-Content -Encoding utf8 src-tauri/target/release/bundle/nsis/build-info.json
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: BillZen-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            src-tauri/target/release/bundle/nsis/build-info.json
            src-tauri/target/release/bundle/nsis/icon-verification.json
          if-no-files-found: error
          retention-days: 14
